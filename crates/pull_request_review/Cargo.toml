[package]
name = "pull_request_review"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
name = "pull_request_review"
path = "src/pull_request_review.rs"

[dependencies]
anyhow.workspace = true
askpass.workspace = true
buffer_diff.workspace = true
multi_buffer.workspace = true
text.workspace = true
chrono.workspace = true
collections.workspace = true
db.workspace = true
editor.workspace = true
futures.workspace = true
git.workspace = true
git_ui.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
markdown.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
theme.workspace = true
time_format.workspace = true
ui.workspace = true
url.workspace = true
util.workspace = true
which.workspace = true
workspace.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language_model.workspace = true
libc.workspace = true
project = { workspace = true, features = ["test-support"] }
# Enabling `project/test-support` turns on `remote/test-support`, which adds a
# `RemoteConnectionOptions::Mock` variant that `remote_connection` only handles under its own
# test-support feature. Without this line the dev build of that crate fails to compile.
remote_connection = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
workspace = { workspace = true, features = ["test-support"] }
zlog.workspace = true
